name: Build libggml-cuda.so for Thor (SM101)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Write build script
        run: |
          cat > build.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          echo "Arch: $(uname -m)"
          apt-get update -qq
          apt-get install -y -qq cmake git file
          nvcc --version | tail -1
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp
          cd /tmp/llama.cpp
          mkdir -p build && cd build
          cmake .. \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=101 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF
          make ggml-cuda -j4
          echo "=== Finding output ==="
          find . -name "libggml-cuda*" -type f
          find . -name "libggml-cuda*" -type f -exec cp {} /output/ \;
          ls -la /output/
          EOF
          chmod +x build.sh

      - name: Build in arm64 CUDA Docker
        run: |
          mkdir -p output
          docker run --rm \
            --platform linux/arm64 \
            -v $(pwd)/build.sh:/build.sh:ro \
            -v $(pwd)/output:/output \
            nvidia/cuda:12.8.0-devel-ubuntu24.04 \
            bash /build.sh

      - name: Package
        run: |
          ls -la output/
          file output/libggml-cuda.so
          tar czf libggml-cuda-sm101.tar.gz -C output .
          ls -lh libggml-cuda-sm101.tar.gz

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libggml-cuda-sm101
          path: libggml-cuda-sm101.tar.gz
          retention-days: 90
